<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简易 2D 城市建造游戏</title>
  <style>
    /* ===== 页面与布局 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background: #1e293b;
      color: #e2e8f0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    h1 { font-size: 24px; margin-bottom: 12px; }

    #gameCanvas {
      background: #f1f5f9;
      border: 3px solid #475569;
      border-radius: 6px;
      cursor: crosshair;
      /* 宽高在 HTML 中预先设为 800x600，JavaScript 里会根据网格重新设置 */
    }

    /* ===== 顶部信息栏 ===== */
    #hud {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
      padding: 10px 18px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      color: #e2e8f0;
    }

    #hud-money { color: #fbbf24; }
    #hud-power { color: #7dd3fc; }
    /* #hud-status 的颜色由 JS 根据买电/卖电/自足状态动态设置 */

    /* ===== 底部工具栏 ===== */
    #toolbar {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tool-btn {
      padding: 10px 18px;
      border: 2px solid transparent;
      border-radius: 6px;
      font-size: 15px;
      color: #fff;
      cursor: pointer;
      user-select: none;
    }

    .tool-btn:hover { opacity: 0.85; }

    /* 当前选中的按钮：白色描边 + 发光效果 */
    .tool-btn.selected {
      border-color: #fff;
      box-shadow: 0 0 8px rgba(14, 165, 233, 0.9);
    }

    /* 每种建筑按钮的颜色，与地图上格子的颜色保持一致 */
    #btn-road        { background: #64748b; }
    #btn-residential { background: #22c55e; }
    #btn-commercial  { background: #3b82f6; }
    #btn-industrial  { background: #facc15; color: #1e293b; }
    #btn-none        { background: #475569; }
    #btn-solar       { background: #f97316; }
    #btn-coal        { background: #dc2626; }

    #stats {
      margin-top: 14px;
      font-size: 15px;
      font-weight: bold;
      color: #cbd5e1;
    }

    #econ {
      margin-top: 6px;
      font-size: 14px;
      color: #fbbf24;
    }

    #status { margin-top: 6px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>🏙️ 简易 2D 城市建造游戏</h1>

  <!-- 顶部信息栏：金钱 / 电力 / 电力状态 -->
  <div id="hud">
    <span id="hud-money">💰 金钱：1200</span>
    <span id="hud-power">⚡ 发电：0 / 耗电：0</span>
    <span id="hud-status">🔌 电力自足</span>
  </div>

  <!-- 游戏地图：Canvas 画布 -->
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <!-- 底部工具栏：建筑按钮，data-type 与后面的地形编号一一对应 -->
  <div id="toolbar">
    <button id="btn-road"        class="tool-btn selected" data-type="1">🛣️ 道路</button>
    <button id="btn-residential" class="tool-btn" data-type="2">🏠 住宅区</button>
    <button id="btn-commercial"  class="tool-btn" data-type="3">🏢 商业区</button>
    <button id="btn-industrial"  class="tool-btn" data-type="4">🏭 工业区</button>
    <button id="btn-solar"       class="tool-btn" data-type="5">☀️ 太阳能板</button>
    <button id="btn-coal"        class="tool-btn" data-type="6">🔥 火力发电站</button>
    <button id="btn-none"        class="tool-btn" data-type="0">🚫 取消选择</button>
  </div>

  <p id="stats">👥 人口：0 / 0</p>
  <p id="econ">🏭 工业：0 格　🏢 商业：0 格　👔 工作：0　🛒 服务：0</p>
  <p id="status">左键点击 / 按住拖动连续铺设 · 右键点击拆除 · 建筑需紧邻道路</p>

  <script>
    // ========== 步骤 2：地图数据与绘制 ==========

    // --- 地图参数 ---
    const GRID_COLS = 20;   // 地图列数
    const GRID_ROWS = 15;   // 地图行数
    const CELL_SIZE = 40;   // 每个格子的边长（像素）

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = GRID_COLS * CELL_SIZE;   // 800px
    canvas.height = GRID_ROWS * CELL_SIZE;  // 600px

    // --- 地形类型编号 ---
    const TILE = {
      EMPTY: 0,        // 空地
      ROAD: 1,         // 道路
      RESIDENTIAL: 2,  // 住宅区
      COMMERCIAL: 3,   // 商业区
      INDUSTRIAL: 4,   // 工业区
      SOLAR: 5,        // 太阳能板（发电 2/格）
      COAL: 6,         // 火力发电站（发电 8/格）
    };

    // --- 每种地形对应的颜色 ---
    const TILE_COLORS = {
      [TILE.EMPTY]:       '#e2e8f0',  // 灰白：空地
      [TILE.ROAD]:        '#64748b',  // 灰：道路
      [TILE.RESIDENTIAL]: '#22c55e',  // 绿：住宅区
      [TILE.COMMERCIAL]:  '#3b82f6',  // 蓝：商业区
      [TILE.INDUSTRIAL]:  '#facc15',  // 黄：工业区
      [TILE.SOLAR]:       '#f97316',  // 橙：太阳能板
      [TILE.COAL]:        '#dc2626',  // 红：火力发电站
    };

    // --- 每种地形的中文名（用于底部状态栏提示） ---
    const TILE_NAMES = {
      [TILE.EMPTY]:       '空地',
      [TILE.ROAD]:        '道路',
      [TILE.RESIDENTIAL]: '住宅区',
      [TILE.COMMERCIAL]:  '商业区',
      [TILE.INDUSTRIAL]:  '工业区',
      [TILE.SOLAR]:       '太阳能板',
      [TILE.COAL]:        '火力发电站',
    };

    // --- 地图状态：二维数组 map[row][col]，初始全部为空地 ---
    const map = [];
    for (let r = 0; r < GRID_ROWS; r++) {
      map.push(new Array(GRID_COLS).fill(TILE.EMPTY));
    }

    // --- 鼠标当前悬停的格子，{r, c} 或 null（步骤 4 的鼠标事件会更新它） ---
    let hoverCell = null;

    // --- 绘制函数：把整个地图画到 Canvas 上 ---
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 逐格绘制
      for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
          const x = c * CELL_SIZE;
          const y = r * CELL_SIZE;

          // 1. 填充格子颜色（住宅按入住率显示深浅）
          ctx.fillStyle = getTileColor(r, c);
          ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);

          // 2. 画网格线（+0.5 让 1px 线条更清晰）
          ctx.strokeStyle = 'rgba(30, 41, 59, 0.2)';
          ctx.lineWidth = 1;
          ctx.strokeRect(x + 0.5, y + 0.5, CELL_SIZE - 1, CELL_SIZE - 1);

          // 3. 建筑未连通道路：红色警示覆盖 + ✕ 标记
          if (map[r][c] !== TILE.EMPTY && map[r][c] !== TILE.ROAD && !isConnectedToRoad(r, c)) {
            ctx.fillStyle = 'rgba(220, 38, 38, 0.4)';
            ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + 8, y + 8);
            ctx.lineTo(x + CELL_SIZE - 8, y + CELL_SIZE - 8);
            ctx.moveTo(x + CELL_SIZE - 8, y + 8);
            ctx.lineTo(x + 8, y + CELL_SIZE - 8);
            ctx.stroke();
          }
        }
      }

      // 3. 悬停高亮：白色半透明覆盖 + 深色描边
      if (hoverCell) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fillRect(hoverCell.c * CELL_SIZE, hoverCell.r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2;
        ctx.strokeRect(
          hoverCell.c * CELL_SIZE + 1,
          hoverCell.r * CELL_SIZE + 1,
          CELL_SIZE - 2,
          CELL_SIZE - 2
        );
      }
    }

    // ========== 步骤 5：人口、经济与需求模拟 ==========

    const HOUSE_CAPACITY = 10;   // 每栋住宅最多住 10 人
    let population = 0;          // 当前总人口（纯模拟数据）
    const statsEl = document.getElementById('stats');
    const econEl = document.getElementById('econ');
    const hudMoneyEl = document.getElementById('hud-money');
    const hudPowerEl = document.getElementById('hud-power');
    const hudStatusEl = document.getElementById('hud-status');

    // --- 人口变化节奏（秒） ---
    const FAST_GROW_INTERVAL = 30;    // 入住率 ≤ 50%（空房过半）：每 30 秒 +1 人
    const SLOW_GROW_INTERVAL = 60;    // 入住率 > 50%：每 60 秒 +1 人
    const DECLINE_INTERVAL = 120;     // 满员后：每 120 秒 -1 人
    const DECLINE_RESUME_PCT = 0.7;   // 流失到 70% 后恢复增长
    const FAST_GROW_PCT = 0.5;        // 快/慢增长的分界入住率
    const DEMAND_DECLINE_INTERVAL = 60;   // 需求不足（缺工作/服务）：每 60 秒 -1 人

    // --- 经济与需求参数 ---
    const JOBS_PER_INDUSTRY = 6;      // 每格工业提供 6 个工作岗位
    const SERVICE_PER_COMMERCIAL = 8; // 每格商业为 8 人提供服务
    const PRODUCE_INTERVAL = 30;      // 每 30 秒结算一次资源产出
    const INDUSTRY_INCOME = 8;        // 每格工业每次产出 +8 元
    const COMMERCIAL_INCOME = 12;     // 每格商业每次产出 +12 元

    // --- 供电系统参数 ---
    const START_MONEY = 1200;         // 初始金钱
    const SOLAR_OUTPUT = 2;           // 太阳能板每格发电 2 单位
    const COAL_OUTPUT = 8;            // 火力发电站每格发电 8 单位
    const SELL_PRICE = 0.25;          // 卖电单价：元/单位/秒
    const BUY_PRICE = 0.5;            // 买电单价：元/单位/秒（比卖电贵一倍）
    const POWER_USE = {               // 每格耗电量（道路/空地/发电建筑不耗电）
      [TILE.RESIDENTIAL]: 1,          // 住宅区：1
      [TILE.COMMERCIAL]: 1,           // 商业区：1
      [TILE.INDUSTRIAL]: 2,           // 工业区：2
    };
    const BUILDING_COST = {           // 建筑造价（普通建筑免费，发电建筑花钱）
      [TILE.SOLAR]: 100,              // 太阳能板：100 元（2 电/格，适合起步）
      [TILE.COAL]: 350,               // 火力发电：350 元（8 电/格，单位成本更低）
    };
    let money = START_MONEY;          // 当前金钱（允许为负 = 欠电费）

    let populationTimer = 0;    // 距下一次人口变化的剩余秒数
    let produceTimer = 0;       // 距下一次资源产出的剩余秒数
    let declining = false;      // 是否处于“满员流失”阶段（持续到 70% 为止）

    // --- 统计某类地形的总数量 ---
    function countTiles(type) {
      let n = 0;
      for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
          if (map[r][c] === type) n++;
        }
      }
      return n;
    }

    // --- 统计某类地形中“连通道路”的数量（只有靠路的建筑才生效） ---
    function countConnectedTiles(type) {
      let n = 0;
      for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
          if (map[r][c] === type && isConnectedToRoad(r, c)) n++;
        }
      }
      return n;
    }

    // --- 总人口容量 = 连通住宅数 × 每栋容量 ---
    function getCapacity() {
      return countConnectedTiles(TILE.RESIDENTIAL) * HOUSE_CAPACITY;
    }

    // --- 工作岗位 = 连通工业数 × 每格岗位 ---
    function getJobs() {
      return countConnectedTiles(TILE.INDUSTRIAL) * JOBS_PER_INDUSTRY;
    }

    // --- 商业服务能力 = 连通商业数 × 每格服务人数 ---
    function getServices() {
      return countConnectedTiles(TILE.COMMERCIAL) * SERVICE_PER_COMMERCIAL;
    }

    // --- 每 30 秒的总产出金额 ---
    function getIncome() {
      return countConnectedTiles(TILE.INDUSTRIAL) * INDUSTRY_INCOME
           + countConnectedTiles(TILE.COMMERCIAL) * COMMERCIAL_INCOME;
    }

    // --- 统计全城发电量与耗电量（只计算连通道路的建筑） ---
    function getPowerInfo() {
      let gen = 0;   // 发电量
      let use = 0;   // 耗电量
      for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
          const tile = map[r][c];
          if (tile === TILE.EMPTY || tile === TILE.ROAD) continue;
          if (!isConnectedToRoad(r, c)) continue;   // 断连建筑不发电也不耗电
          if (tile === TILE.SOLAR) gen += SOLAR_OUTPUT;
          else if (tile === TILE.COAL) gen += COAL_OUTPUT;
          use += POWER_USE[tile] || 0;
        }
      }
      return { gen, use };
    }

    // --- 指定住宅格子的入住人数（人口按“先建先住”顺序填满各栋，未连通不算） ---
    function getTileOccupancy(r, c) {
      if (map[r][c] !== TILE.RESIDENTIAL) return 0;
      if (!isConnectedToRoad(r, c)) return 0;
      let remaining = population;
      for (let i = 0; i < GRID_ROWS; i++) {
        for (let j = 0; j < GRID_COLS; j++) {
          if (i === r && j === c) return Math.min(remaining, HOUSE_CAPACITY);
          if (map[i][j] === TILE.RESIDENTIAL && isConnectedToRoad(i, j)) {
            remaining -= Math.min(remaining, HOUSE_CAPACITY);
          }
        }
      }
      return 0;
    }

    // --- 格子颜色：住宅按入住率在浅绿（空房）与深绿（住满）之间过渡 ---
    function getTileColor(r, c) {
      const tile = map[r][c];
      if (tile !== TILE.RESIDENTIAL) return TILE_COLORS[tile];
      const t = getTileOccupancy(r, c) / HOUSE_CAPACITY;   // 0（空）~ 1（满）
      const R = Math.round(167 + (21 - 167) * t);    // #a7f3d0 → #15803d
      const G = Math.round(243 + (128 - 243) * t);
      const B = Math.round(208 + (61 - 208) * t);
      return `rgb(${R}, ${G}, ${B})`;
    }

    // --- 判断当前人口阶段，返回下一次变化的方向、节奏与原因 ---
    // reason: nohouse（无连通住宅）/ demand（缺工作或服务）/ full（满员流失）/ grow（正常增长）/ stall（需求饱和）
    function getPopulationPhase() {
      const capacity = getCapacity();
      const jobs = getJobs();
      const services = getServices();

      // 没有连通住宅：有人口就流失，没人口就静止
      if (capacity === 0) {
        return { action: population > 0 ? -1 : 0, interval: DECLINE_INTERVAL, reason: 'nohouse' };
      }

      const pct = population / capacity;

      // 满员（或超员）：进入流失阶段
      if (pct >= 1) {
        declining = true;
        return { action: -1, interval: DECLINE_INTERVAL, reason: 'full' };
      }

      // 流失进行中：还没降到 70%，继续流失
      if (declining && pct > DECLINE_RESUME_PCT) {
        return { action: -1, interval: DECLINE_INTERVAL, reason: 'full' };
      }
      declining = false;

      // 需求不足：人口超过工作岗位或商业服务能力 → 流失
      if (population > jobs || population > services) {
        return { action: -1, interval: DEMAND_DECLINE_INTERVAL, reason: 'demand' };
      }

      // 需求饱和：人口恰好等于工作岗位或服务上限 → 暂停增长
      if (population >= jobs || population >= services) {
        return { action: 0, interval: 0, reason: 'stall' };
      }

      // 正常增长：入住率 ≤50% 快增长，>50% 慢增长
      const interval = pct <= FAST_GROW_PCT ? FAST_GROW_INTERVAL : SLOW_GROW_INTERVAL;
      return { action: 1, interval, reason: 'grow' };
    }

    // --- 地图变化后重置倒计时，让节奏按新状态重新计算 ---
    function resetTimers() {
      populationTimer = getPopulationPhase().interval;
      produceTimer = PRODUCE_INTERVAL;
    }

    // --- 更新人口与需求信息栏 ---
    function updateStats() {
      const capacity = getCapacity();
      const houses = countConnectedTiles(TILE.RESIDENTIAL);
      const totalHouses = countTiles(TILE.RESIDENTIAL);
      const vacancy = Math.max(0, capacity - population);
      const phase = getPopulationPhase();

      let trend;
      if (phase.reason === 'nohouse') {
        trend = totalHouses > 0
          ? '⚠️ 住宅未连通道路，人口不会增长'
          : (population > 0 ? '⚠️ 没有住宅，人口流失中' : '⚠️ 没有住宅，人口不会增长');
      } else if (phase.reason === 'full') {
        trend = '📉 住房已满，人口流失中（降到 70% 恢复增长）';
      } else if (phase.reason === 'demand') {
        trend = `📉 工作/服务不足，人口流失中（每 ${DEMAND_DECLINE_INTERVAL} 秒 -1）`;
      } else if (phase.reason === 'stall') {
        trend = '⏸ 需求饱和：建更多工业/商业才能继续增长';
      } else if (phase.interval === FAST_GROW_INTERVAL) {
        trend = '📈 空房过半，人口增长中（每 30 秒 +1）';
      } else {
        trend = '📈 入住过半，人口增长中（每 60 秒 +1）';
      }

      statsEl.textContent =
        `👥 人口：${population} / ${capacity}　` +
        `🏠 住宅：${houses} 栋（空位 ${vacancy}）　${trend}` +
        (phase.action !== 0 ? `　⏱ 下次变化：${Math.max(0, populationTimer)}s` : '');

      const jobs = getJobs();
      const services = getServices();
      const industry = countConnectedTiles(TILE.INDUSTRIAL);
      const commercial = countConnectedTiles(TILE.COMMERCIAL);
      const solar = countConnectedTiles(TILE.SOLAR);
      const coal = countConnectedTiles(TILE.COAL);
      const income = getIncome();
      econEl.textContent =
        `🏭 工业：${industry} 格（+${industry * INDUSTRY_INCOME}/30s）　` +
        `🏢 商业：${commercial} 格（+${commercial * COMMERCIAL_INCOME}/30s）　` +
        `☀️ 太阳能：${solar} 格　🔥 火电：${coal} 格　` +
        `👔 工作：${jobs}　🛒 服务：${services}` +
        (income > 0 ? `　⏱ 下次产出：${Math.max(0, produceTimer)}s` : '');

      // 顶部 HUD：金钱 / 电力 / 电力状态
      const power = getPowerInfo();
      hudMoneyEl.textContent = `💰 金钱：${Math.round(money)}`;
      hudMoneyEl.style.color = money < 0 ? '#f87171' : '#fbbf24';
      hudPowerEl.textContent = `⚡ 发电：${power.gen} / 耗电：${power.use}`;
      let statusText, statusColor;
      if (power.gen < power.use) {
        statusText = `正在买电（-${((power.use - power.gen) * BUY_PRICE).toFixed(2)}元/秒）`;
        statusColor = '#f87171';
      } else if (power.gen > power.use) {
        statusText = `正在卖电（+${((power.gen - power.use) * SELL_PRICE).toFixed(2)}元/秒）`;
        statusColor = '#4ade80';
      } else {
        statusText = '电力自足';
        statusColor = '#94a3b8';
      }
      hudStatusEl.textContent = `🔌 ${statusText}`;
      hudStatusEl.style.color = statusColor;
    }

    // --- 每秒推进一次模拟：人口变化 + 资源产出 ---
    function gameTick() {
      // 人口结算
      const phase = getPopulationPhase();
      if (phase.action !== 0) {
        populationTimer -= 1;
        if (populationTimer <= 0) {
          // 到点执行一次人口变化
          population = phase.action === 1
            ? Math.min(getCapacity(), population + 1)
            : Math.max(0, population - 1);
          // 变化后按新状态重新设定下一次节奏
          populationTimer = getPopulationPhase().interval;
        }
      }

      // 资源产出结算（有产出建筑才倒计时）
      const income = getIncome();
      if (income > 0) {
        produceTimer -= 1;
        if (produceTimer <= 0) {
          money += income;
          produceTimer = PRODUCE_INTERVAL;
        }
      }

      // 电力收支结算（每秒一次）：自足则卖电入账，不足则买电扣钱（允许为负）
      const power = getPowerInfo();
      if (power.gen >= power.use) {
        money += (power.gen - power.use) * SELL_PRICE;
      } else {
        money -= (power.use - power.gen) * BUY_PRICE;
      }

      draw();
      updateStats();
    }

    setInterval(gameTick, 1000);
    resetTimers();   // 初始化倒计时
    updateStats();   // 初始刷新信息栏

    // --- 初始绘制：此时会显示一块 20x15 的空地网格 ---
    draw();

    // ========== 步骤 3：工具栏建筑选择 ==========

    let selectedType = TILE.ROAD;   // 当前选中的建筑类型，默认道路

    const toolButtons = document.querySelectorAll('.tool-btn');
    toolButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        // 取消所有按钮的选中样式，再给当前按钮加上
        toolButtons.forEach((b) => b.classList.remove('selected'));
        btn.classList.add('selected');
        // 读取按钮的 data-type 属性（字符串），转成数字作为当前建筑类型；
        // “取消选择”按钮的 data-type="0" 会转成 null，表示未选中任何建筑
        selectedType = Number(btn.dataset.type) || null;
        updateStatusText();   // 选择变化后刷新底部提示
      });
    });
    // ========== 步骤 4：鼠标交互（放置 / 拆除） ==========

    const statusEl = document.getElementById('status');
    const DEFAULT_HINT = '左键点击 / 按住拖动连续铺设 · 右键点击拆除 · 建筑需紧邻道路';

    // --- 把鼠标事件坐标换算成格子索引 {r, c}，点在地图外返回 null ---
    function getCellFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;   // 鼠标在画布内的 x 像素坐标
      const y = e.clientY - rect.top;    // 鼠标在画布内的 y 像素坐标
      const c = Math.floor(x / CELL_SIZE);
      const r = Math.floor(y / CELL_SIZE);
      if (c >= 0 && c < GRID_COLS && r >= 0 && r < GRID_ROWS) {
        return { r, c };
      }
      return null;
    }

    // --- 判断某格是否与道路相邻（上下左右任一方向） ---
    function isConnectedToRoad(r, c) {
      const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      return dirs.some(([dr, dc]) => {
        const nr = r + dr;
        const nc = c + dc;
        return nr >= 0 && nr < GRID_ROWS && nc >= 0 && nc < GRID_COLS && map[nr][nc] === TILE.ROAD;
      });
    }

    // --- 该类型能否放在 (r, c)：道路随处可放，建筑必须紧邻道路 ---
    function canPlaceBuilding(r, c, type) {
      if (type === TILE.ROAD) return true;
      return isConnectedToRoad(r, c);
    }

    // --- 更新底部状态栏文字 ---
    function updateStatusText() {
      if (hoverCell) {
        const { r, c } = hoverCell;
        const tile = map[r][c];
        let extra = '';
        if (tile === TILE.RESIDENTIAL) {
          extra = `（入住 ${getTileOccupancy(r, c)}/${HOUSE_CAPACITY}）`;
        }
        if (tile === TILE.SOLAR) extra = `（发电 ${SOLAR_OUTPUT} 单位）`;
        if (tile === TILE.COAL) extra = `（发电 ${COAL_OUTPUT} 单位）`;
        // 建筑未连通道路时给出警告
        if (tile !== TILE.EMPTY && tile !== TILE.ROAD && !isConnectedToRoad(r, c)) {
          extra += '　⚠️ 未连通道路，不生效';
        }
        // 悬停空地时提示当前建筑能否放置
        if (tile === TILE.EMPTY && selectedType !== null && !canPlaceBuilding(r, c, selectedType)) {
          statusEl.textContent = `格子 (${c}, ${r})：空地　❌ ${TILE_NAMES[selectedType]}必须紧邻道路`;
          return;
        }
        statusEl.textContent = `格子 (${c}, ${r})：${TILE_NAMES[tile]}${extra}`;
      } else if (selectedType === null) {
        statusEl.textContent = '未选择建筑类型：请先在底部工具栏选择；右键点击仍可拆除';
      } else {
        statusEl.textContent = DEFAULT_HINT;
      }
    }

    // --- 拖动连续铺设：左键按下即开始涂画，按住移动时持续铺设 ---
    let isPainting = false;       // 左键是否处于按下状态
    let lastPaintedCell = null;   // 上一次铺设的格子，避免在同一格重复操作

    function paintAt(cell) {
      if (!cell) return;
      if (selectedType === null) return;   // 未选择建筑：点击/拖动不放置
      if (lastPaintedCell && lastPaintedCell.r === cell.r && lastPaintedCell.c === cell.c) return;
      lastPaintedCell = cell;

      // 建筑必须紧邻道路，否则拒绝放置并提示
      if (!canPlaceBuilding(cell.r, cell.c, selectedType)) {
        statusEl.textContent = '❌ 建筑必须紧邻道路：请先铺设道路，或换一块靠路的空地';
        return;
      }

      // 金钱不足时不能建造需要花钱的建筑
      const cost = BUILDING_COST[selectedType] ?? 0;
      if (money < cost) {
        statusEl.textContent =
          `❌ 金钱不足：建造${TILE_NAMES[selectedType]}需要 ${cost} 元（当前 ${Math.round(money)} 元）`;
        return;
      }

      map[cell.r][cell.c] = selectedType;
      money -= cost;
      draw();
      updateStatusText();
      updateStats();    // 建筑数量可能变化，刷新人口与经济信息
      resetTimers();    // 容量/产出变化，重新计算节奏
    }

    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;   // 只处理左键
      isPainting = true;
      paintAt(getCellFromEvent(e));
      e.preventDefault();           // 防止拖动时触发页面默认行为
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button !== 0) return;   // 只处理左键松开
      isPainting = false;
      lastPaintedCell = null;
    });

    // --- 右键：拆除建筑，恢复为空地 ---
    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();   // 屏蔽浏览器自带的右键菜单
      const cell = getCellFromEvent(e);
      if (cell) {
        map[cell.r][cell.c] = TILE.EMPTY;
        draw();
        updateStatusText();
        updateStats();    // 建筑数量可能变化，刷新人口与经济信息
        resetTimers();    // 容量/产出变化，重新计算节奏
      }
    });

    // --- 鼠标移动：更新悬停高亮；按住左键时连续铺设 ---
    canvas.addEventListener('mousemove', (e) => {
      hoverCell = getCellFromEvent(e);
      if (isPainting) paintAt(hoverCell);
      draw();
      updateStatusText();
    });

    // --- 鼠标离开画布：取消高亮，并中断本次拖画 ---
    canvas.addEventListener('mouseleave', () => {
      hoverCell = null;
      lastPaintedCell = null;
      draw();
      updateStatusText();
    });
  </script>
</body>
</html>
